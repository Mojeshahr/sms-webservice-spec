# وضعیت پیامک ارسالی، نسخهٔ ۳.
#
# مقدار فیلد StatusCode در پاسخ StatusById و StatusByUserTraceId.
#
# وضعیت بلافاصله نهایی نیست: پیامک از ۰ شروع می‌شود و تا ۴ چند مرحله جلو
# می‌رود. وضعیت‌های ۴، ۵، ۶، ۷، ۸، ۹ و ۱۱ تا ۱۷ پایانی‌اند.
#
# متن‌ها عیناً همان چیزی است که در فهرست رسمی منتشر شده.
#
# in_api    : در enum منتشرشدهٔ swagger هست
# in_docs   : در فهرست رسمی doc.sms-webservice.com هست
# confirmed : کسی از تیم وجود و معنی‌اش را تأیید کرده است
#
# هر کدی که confirmed نباشد باید از سمت پنل پیگیری شود.

version: 3
sources:
  api: https://api.sms-webservice.com/swagger/docs/v3
  docs: https://doc.sms-webservice.com/sms-status.html
  captured: 2026-08-22

codes:
  - code: 0
    fa: در صف سامانه
    description: پیامک در صف ارسال سامانه است و هنوز از سامانه خارج نشده است.
    final: false
    in_api: true
    in_docs: true
    confirmed: true

  - code: 1
    fa: ارسال شده، بدون وضعیت
    description: پیامک از سامانه خارج شده و تحویل اپراتور شده، اما هنوز وضعیتی از اپراتور دریافت نشده است.
    final: false
    in_api: true
    in_docs: true
    confirmed: true

  - code: 2
    fa: ارسال شده، در صف
    description: پیامک تحویل اپراتور داده شده، و در صف ارسال اپراتور ارسال کننده می باشد.
    final: false
    in_api: true
    in_docs: true
    confirmed: true

  - code: 3
    fa: در انتظار تحویل گوشی
    description: پیامک از اپراتور خارج شده، اما هنوز تاییده دریافت از گوشی دریافت نشده (ممکن است گوشی در دسترس نباشد).
    final: false
    in_api: true
    in_docs: true
    confirmed: true

