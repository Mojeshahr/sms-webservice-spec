# کدهای خطای وب‌سرویس، نسخهٔ ۳.
#
# مقدار فیلد ErrorCode در پاکت پاسخ. فقط وقتی معنا دارد که Success برابر
# false باشد.
#
# متن‌ها عیناً همان چیزی است که در فهرست رسمی منتشر شده، از جمله غلط‌های
# نگارشی، تا با آنچه کاربر در فیلد Error می‌بیند یکی بماند.
#
# in_api    : در enum منتشرشدهٔ swagger هست
# in_docs   : در فهرست رسمی doc.sms-webservice.com هست
# confirmed : کسی از تیم وجود و معنی‌اش را تأیید کرده است
#
# هر کدی که confirmed نباشد یک شکاف واقعی در خود سرویس است، نه اشتباه این
# فایل، و باید از سمت پنل پیگیری شود. اعتبارسنج فهرستشان را می‌دهد.
#
# enum در spec شامل کدهایی است که in_api یا confirmed باشند: یعنی یا سرویس
# اعلامشان می‌کند، یا ما مستقلاً وجودشان را تأیید کرده‌ایم.

