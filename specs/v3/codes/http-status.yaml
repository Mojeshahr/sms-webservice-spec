  path: /Send
  operation_id: Send
  responses:
    '200':
      description: پاسخ سامانه. موفقیت را از فیلد `Success` بخوانید.
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SendResponse'
