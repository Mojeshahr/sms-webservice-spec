        application/json:
          schema:
            $ref: '#/components/schemas/SendTokenSingleConcatParamResponse'
    '429':
      description: تعداد درخواست بیش از حد مجاز است؛ زمان تلاش بعدی را از هدر پاسخ بخوانید.
      headers: {}
