# وضعیت تأیید قالب، نسخهٔ ۳.
#
# مقدار فیلد Status در هر درایهٔ پاسخ TokenList. فقط قالب تأییدشده قابل
# ارسال است.
#
# این همان چهار وضعیتی است که ادمین در پنل پیامکی برای قالب کاربر تعیین
# می‌کند.
#
# ⚠ enum منتشرشدهٔ swagger فقط ۱، ۲ و ۳ را اعلام می‌کند و مقدار ۰ را جا
# انداخته است. مقدار ۰ واقعی است و در پنل وجود دارد، پس در spec آمده.
# اصلاحش سمت سرویس لازم است.

version: 3
sources:
  api: https://api.sms-webservice.com/swagger/docs/v3
  captured: 2026-08-22
  legacy_docs:
    status: بازنشسته، بدون جانشین در همان نشانی
    note: این صفحه از دور خارج می‌شود و نباید به آن لینک داد. ستون in_legacy_docs فقط ثبت می‌کند آن صفحه چه چیزی را پوشش می‌داد، تا مرجع تازه در docs.payam-resan.com همان کاستی‌ها را تکرار نکند.

codes:
  - code: 0
    fa: در انتظار بررسی مقادیر
    description: قالب ثبت شده و منتظر بررسی ادمین است. تا تأیید نشود قابل ارسال نیست.
    sendable: false
    in_api: false
    in_legacy_docs: true
    confirmed: true
    note: در enum منتشرشدهٔ swagger نیست. وجودش از پنل تأیید شده.

  - code: 1
    fa: تأیید شده
    description: قالب تأیید شده و قابل ارسال است.
    sendable: true
    in_api: true
    in_legacy_docs: true
    confirmed: true

  - code: 2
    fa: رد شده، قابل ویرایش
    description: ادمین قالب را رد کرده است، اما کاربر می‌تواند ویرایشش کند و دوباره برای بررسی بفرستد.
    sendable: false
    in_api: true
    in_legacy_docs: true
    confirmed: true

  - code: 3
    fa: رد شده، غیر قابل ویرایش
    description: ادمین قالب را رد و قفل کرده است. ویرایش ممکن نیست و باید قالب تازه‌ای ساخته شود.
    sendable: false
    in_api: true
    in_legacy_docs: true
    confirmed: true
