info:
  title: راهنمای وب‌سرویس پیامک V3
  description: |-
    کلید `ApiKey` در POST داخل JSON و در GET داخل نشانی است. HTTP 200 همیشه به معنی موفقیت نیست؛ `Success` را بررسی کنید و خطا را از `ErrorCode` و `Error` بخوانید.

    برای تست بدون ارسال و هزینه، پایهٔ `/api/V3` را با `/api/V3SandBox` جایگزین کنید. اگر کلید تست تنظیم شده است، همان را بفرستید.

    <details><summary><strong>نکات اتصال</strong></summary>

    از HTTPS و ترجیحاً POST استفاده کنید. شماره‌های فرستنده و الگوها را از متدهای اطلاعات حساب و فهرست الگوها بگیرید.

    مجوز لازم کنار هر متد آمده است. کلید باید فعال و IP شما مجاز باشد. سقف ارسال و هزینه به تنظیمات حساب بستگی دارد.

    پذیرش درخواست به معنی تحویل نیست. پس از قطع ارتباط، پیش از ارسال دوباره وضعیت را با شناسهٔ پیگیری بررسی کنید.

    شناسه‌ها عددی و اعتبار طبق واحد نمایش نسخهٔ قدیمی است. کدهای خطای V3 با V4 تفاوت دارند. نام فیلد فرستندهٔ پیام دریافتی `Form` است.

    خطاهای HTTP مثل 429 یا 5xx ممکن است قالب پاسخ دیگری داشته باشند.

    </details>

    <details><summary><strong>کدهای خطا</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 1 | `InvalidApiKey` | ApiKey نادرست است |
    | 2 | `ApiIsNotActive` | ارسال از وبسرویس برای این کاربر فعال نشده است. |
    | 3 | `UserIsNotActive` | کاربر فعال نیست. |
    | 4 | `ApiTemproryDeactive` | ارسال از طریق Api موقتا غیر فعال است. |
    | 5 | `MethodIsDeactive` | ارسال از طریق این متد موقتا غیر فعال است. |
    | 6 | `NoAuthntication` | احراز هویت حساب انجام نشده است. |
    | 8 | `AccountInfoIsIncomplete` | اطلاعات هویتی کاربر به صورت کامل درج نشده است. |
    | 9 | `InvalidParameters` | مقادیر ورودی نادرست است. |
    | 10 | `IpIsNotValid` | آی پی درخواست دهنده در لیست آی پی های معتبر نیست |
    | 11 | `MalformattedApiKey` | فرمت ورودی ApiKey نادرست است |
    | 12 | `InvalidSender` | شماره ارسال کننده نادرست است |
    | 13 | `InvalidDestination` | شماره دریافت کننده باید با 9 یا 989 شروع شود |
    | 14 | `UnauthorizedMethod` | شما به این متد دسترسی ندارید |
    | 15 | `DailyLimitReached` | سقف ارسال روزانه به پایان رسید |
    | 16 | `ApiLimitReached` | سقف ارسال Api به پایان رسید |
    | 17 | `NightlyLimitReached` | سقف ارسال شبانه به پایان رسید |
    | 18 | `ShareLineLimitReached` | سقف ارسال خط اشتراکی به پایان رسید |
    | 19 | `CreditIsLow` | اعتبار حساب کافی نیست |
    | 20 | `TooManyRequests` | تعداد درخواست بیش از حد مجاز است |
    | 100 | `InternalError` | خطای داخلی سیستم |

    </details>


    <details><summary><strong>وضعیت تحویل پیامک</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 0 | `InQueue` | در صف سامانه |
    | 1 | `SentNoStatus` | ارسال شده، بدون وضعیت |
    | 2 | `SentInQueue` | ارسال شده، در صف |
    | 3 | `SentPendingToDeliver` | در انتظار تحویل گوشی |
    | 4 | `Delivered` | تحویل به گوشی |
    | 5 | `SentFailed` | نرسیده به گوشی |
    | 6 | `Failed` | خطا در ارسال |
    | 7 | `BlackList` | گیرنده مسدود |
    | 8 | `NotFound` | شناسه پیدا نشد |
    | 9 | `Expired` | منقضی |
    | 10 | `Unknown` | نامشخص |
    | 11 | `DeactiveDestination` | دریافت کننده نامعتبر |
    | 12 | `UserBlackList` | گیرنده در لیست سیاه اکانت شماست |
    | 13 | `InvalidDestinationForOperator` | گیرنده نامعتبر |
    | 14 | `HasBlockWord` | متن بلاک |
    | 15 | `UnsubscribedByRecepient` | لغو دریافت توسط گیرنده |
    | 16 | `BlockedByRequester` | بلاک شده |
    | 17 | `DailyLimitReached` | اتمام سقف ارسال روزانه |
    | 18 | `ApiLimitReached` | اتمام سقف ارسال Api |
    | 19 | `NightlyLimitReached` | اتمام سقف ارسال شبانه |
    | 20 | `ShareLineLimitReached` | اتمام سقف خط اشتراکی |
    | 21 | `AccountNotAuthenticated` | حساب احراز نشده |

    </details>


    <details><summary><strong>وضعیت تأیید الگو</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 1 | `Pending` | در انتظار تأیید |
    | 2 | `Approved` | تأییدشده |
    | 3 | `Rejected` | ردشده |

    </details>



    این فایل با Swagger رسمی تطبیق داده شده است؛ درخواست‌ها و پاسخ‌های نمونه از همان سند آمده‌اند و در این مرحله با سرویس زنده آزموده نشده‌اند. اعلان‌های required و nullable عین قرارداد منتشرشده حفظ شده‌اند؛ تعارض متن با اسکیما در گزارش تطبیق ثبت شده است.
