paths:
  /Send:
    get:
      tags:
      - ارسال
      summary: ارسال یک متن؛ شماره گیرندگان را در نشانی با ویرگول جدا کنید.
      description: |-
        مجوز لازم برای کلید: `Send`.

        در این متد، `ApiKey` در پارامترهای نشانی است. در صورت امکان از نسخهٔ POST استفاده کنید.
      operationId: Send
      parameters:
      - name: ApiKey
        in: query
        required: true
        description: کلید API حساب؛ در صورت امکان از نسخهٔ POST استفاده کنید.
        schema:
          type:
          - string
          - 'null'
        x-position: 1
        example: YOUR_API_KEY
      - name: Text
        in: query
        schema:
          type:
          - string
          - 'null'
        x-position: 2
        example: پیام نمونه
      - name: Sender
        in: query
        schema:
          type: integer
          format: int64
        x-position: 3
        example: 3000123456
      - name: Recipients
        in: query
        schema:
          type:
          - string
          - 'null'
        x-position: 4
        example: '989120000001'
      - name: source-app
        in: header
        description: نام اختیاری برنامهٔ شما برای ثبت در گزارش درخواست‌ها؛ حداکثر ۱۰۰ نویسه. این مقدار
          کلید دسترسی نیست.
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: 'ابتدا Success را بررسی کنید: نتیجه در Result و خطا در ErrorCode و Error است.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
              examples:
                success:
                  summary: پاسخ موفق
                  value:
                    Success: true
                    ErrorCode: null
                    Error: null
                    Result:
                    - Id: 123456789012345
                      UserTraceId: 10001
                invalid-key:
                  summary: کلید نامعتبر
                  value:
                    Success: false
                    ErrorCode: 1
                    Error: ApiKey نادرست است
                    Result: null
                invalid-input:
                  summary: ورودی نامعتبر
                  value:
                    Success: false
                    ErrorCode: 9
                    Error: مقادیر ورودی نادرست است
                    Result: null
                insufficient-credit:
                  summary: اعتبار ناکافی
                  value:
                    Success: false
                    ErrorCode: 19
                    Error: اعتبار حساب کافی نیست
                    Result: null
        '429':
          description: تعداد درخواست بیش از حد مجاز است؛ زمان تلاش بعدی را از هدر پاسخ بخوانید.
        default:
          description: خطای ارتباط یا سرور؛ قالب پاسخ ممکن است با پاسخ معمول وب‌سرویس تفاوت داشته باشد.
      x-source-operation-id: LegacyV3_Send
      x-source-tags:
      - ارسال پیامک
