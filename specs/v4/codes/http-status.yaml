sources:
  api: https://www.payam-resan.com/uapi/v4/swagger.json
  captured: '2026-11-12'
  sha256: 3406d26a3258370a7034ebdb8fa42f8b775938ecd2e0785991b3f8bf9e5ab968
  verification: published-swagger-and-approved-v3-policy-review
  policy_reference: ../../v3/codes/error-codes.yaml
schema_document: ../openapi.yaml
guidance:
  - کد HTTP از کد خطای API و وضعیت تحویل جداست؛ دریافت 200 به‌تنهایی نشانه موفقیت نیست.
  - پاسخ default کد عددی HTTP نیست و خطاهای دیگری را پوشش می‌دهد.
  - ارجاع‌های اسکیما نسبت به سند مشخص‌شده در schema_document هستند.
  - در پاسخ HTTP 429 زمان تلاش بعدی را از هدر پاسخ بخوانید و نرخ فراخوانی را با backoff نمایی
    کاهش دهید؛ کد خطای API شماره 20 در نسخه ۴ مربوط به سهمیه ارسال OTP است، نه محدودیت نرخ درخواست.
