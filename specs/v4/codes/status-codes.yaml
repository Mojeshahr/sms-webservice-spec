guidance:
  - روی statusCode تصمیم بگیرید و متن status را برای نمایش استفاده کنید.
  - استعلام را دسته‌ای بفرستید؛ هر دو متد آرایه‌ای از شناسه‌های رشته‌ای می‌گیرند.
  - فاصله استعلام‌ها کمتر از چند دقیقه نباشد. وضعیت pending را دوباره استعلام کنید، نه دوباره
    ارسال.
  - در وضعیت final استعلام را متوقف کنید؛ در not-sent مانع را برطرف کنید و در not-found شناسه
    و تعلق آن به حساب را بررسی کنید.
  - کد خطای API شماره 20 در نسخه ۴ سهمیه OTP است و جایگزین پاسخ HTTP 429 برای محدودیت نرخ نیست.
  - این جدول مربوط به ApiMessageStatus است؛ وضعیت گیرنده کمپین از enum مستقل SentMessageStatus
    می‌آید.
