guidance:
  - ابتدا success را بررسی کنید؛ errorCode فقط در پاسخ ناموفق معنای خطا دارد.
  - دسته never یعنی درخواست بدون رفع علت خطا دوباره فرستاده نشود؛ پس از اصلاح، درخواست تازه
    قابل ارسال است.
  - دسته backoff یعنی تلاش با فاصله افزایشی و limit-reset یعنی انتظار تا آزاد شدن سهمیه.
  - در متدهای دارای ورودی userTraceId، پس از timeout یا خطای 100 ثبت پیام را با StatusByUserTraceId
    بررسی کنید. SendTokenSingle و SendTokenSingleConcatParam ورودی userTraceId ندارند؛ برای
    پیگیری با شناسه دلخواه از SendTokenMulti استفاده کنید. درخواست تغییر داده بدون احراز نتیجه
    قبلی خودکار تکرار نشود.
  - کد خطای API با وضعیت HTTP جداست. کد 20 نسخه ۴ محدودیت سهمیه OTP است؛ محدودیت نرخ HTTP با
    پاسخ 429 اعلام می‌شود.
  - سهمیه OTP برای هر کاربر در پنل کاربری مشخص است و دو سهمیه ارسال روزانه و شبانه دارد.
