  /SendOtp:
    post:
      tags:
        - قالب
      summary: ارسال کد ۴ تا ۸ رقمی با متن ثابت سامانه.
      description: |-
        برای فرستادن کد ۴ تا ۸ رقمی با متن ثابت سامانه، بدون تعریف قالب اختصاصی. کد در فیلد `code` قرار می‌گیرد و ارقام فارسی نیز پذیرفته می‌شوند.

        مجوز لازم برای کلید: `Send`. دسترسی OTP حساب نیز باید فعال باشد.
      operationId: V4_SendOtp
