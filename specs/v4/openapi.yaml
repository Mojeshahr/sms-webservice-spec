      additionalProperties: false
      properties:
        success:
          type: boolean
          description: موفق بودن درخواست؛ دریافت HTTP 200 به‌تنهایی نشانه موفقیت نیست.
        errorCode:
          description: کد خطا؛ در پاسخ موفق null است.
          anyOf:
          - $ref: '#/components/schemas/ApiErrorType'
          - type: 'null'
        error:
          type:
          - string
          - 'null'
          description: توضیح خطا؛ در پاسخ موفق null است.
        moreInfo:
          type:
          - string
          - 'null'
          description: جزئیات تکمیلی خطای سقف مصرف؛ در حالت عادی null است.
        result:
          description: نتیجه درخواست؛ در صورت خطا null است.
          anyOf:
          - $ref: '#/components/schemas/ApiCampaignDraftResponse'
          - type: 'null'
    ApiErrorType:
      type: integer
      description: کد خطا در ErrorCode پاسخ می‌آید. معنای برخی کدها در V3 و V4 متفاوت است.
      x-enumNames:
      - InvalidApiKey
      - ApiIsNotActive
      - UserIsNotActive
      - ApiTemproryDeactive
      - MethodIsDeactive
      - NoAuthntication
      - AccountInfoIsIncomplete
      - InvalidParameters
      - IpIsNotValid
      - MalformattedApiKey
      - InvalidSender
      - InvalidDestination
      - UnauthorizedMethod
      - DailyLimitReached
      - ApiLimitReached
      - NightlyLimitReached
      - ShareLineLimitReached
      - CreditIsLow
      - OtpApiLimitReached
      - DailyPartLimitReached
      - DailyCreditLimitReached
      - InvalidSendTime
      - RecipientVoiceLimitReached
      - InternalError
