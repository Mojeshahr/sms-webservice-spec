# مرجع رسمی وب‌سرویس پنل پیامکی پیام رسان، نسخه ۴.
#
# توصیف متدها و مدل‌های همین نسخه؛ جدول‌های خطا و وضعیت در codes/ هستند.
# Swagger UI: https://www.payam-resan.com/uapi/v4
# Swagger JSON: https://www.payam-resan.com/uapi/v4/swagger.json
openapi: 3.1.0
info:
  title: وب‌سرویس پنل پیامکی پیام رسان
  summary: ارسال، دریافت و گزارش‌گیری پیامک و مدیریت کمپین
  version: '4'
  description: |
    رابط برنامه‌نویسی [پنل پیامکی پیام رسان](https://payam-resan.com)، نسخه ۴.

    ## احراز هویت

    در هر درخواست، کلید حساب بخشی از ورودی خود متد است:

    - در متدهای `POST`، فیلد `apiKey` در بدنه JSON
    - در متدهای `GET`، پارامتر `ApiKey` در query

    املای فیلدها و بزرگی و کوچکی حروف را مطابق متد رعایت کنید.
    برای دو متد ارسال قالب که هر دو روش را دارند، `POST` ترجیح دارد تا کلید
    و مقادیر قالب در نشانی قرار نگیرند.

    کلید باید فعال باشد و IP درخواست‌کننده مجاز باشد. مجوز لازم برای کلید در هر
    متد آمده است. سقف ارسال و هزینه به تنظیمات حساب بستگی دارد.
    از HTTPS استفاده کنید.

    هدر اختیاری `source-app` نام برنامه فراخوان را برای گزارش درخواست‌ها
    مشخص می‌کند؛ نوع آن رشته و حداکثر طول آن ۱۰۰ نویسه است.

    ## پاکت پاسخ

    دریافت HTTP `200` به‌تنهایی نشانه موفقیت نیست. ابتدا `success` را بخوانید:

    - `success` موفق یا ناموفق بودن درخواست را مشخص می‌کند.
    - `errorCode` کد خطا و `error` توضیح آن است؛ در پاسخ موفق هر دو `null` هستند.
    - `moreInfo` جزئیات تکمیلی خطای سقف مصرف را نگه می‌دارد و در حالت عادی `null` است.
    - `result` نتیجه متد است و ساختار آن در هر متد تعریف شده است.

    هر عملیات پاسخ‌های HTTP `200`، `429` و `default` دارد. پاسخ `429` مربوط
    به درخواست بیش از حد مجاز است. پاسخ `default` خطاهای ارتباط یا سرور را پوشش
    می‌دهد و کد عددی HTTP نیست. خطاهای HTTP ممکن است پاکت پاسخ معمول را نداشته باشند.

    پذیرش درخواست به معنی تحویل پیام نیست. پس از قطع ارتباط، پیش از ارسال
    دوباره وضعیت پیام را با شناسه پیگیری بررسی کنید.

    شرح کدهای خطا در `codes/error-codes.yaml` و اعلان‌های HTTP هر عملیات در
    `codes/http-status.yaml` آمده است.

    ## قالب شماره‌ها و شناسه‌ها

    شماره موبایل با رقم، مانند `9120000001` یا `989120000001`، فرستاده می‌شود.
    متد صوتی `SendVoiceOtp` شماره ثابت را نیز می‌پذیرد.
    خطوط مجاز کلید از `GetAccountInfo` گرفته می‌شوند.

    شناسه‌هایی که نوع `string` دارند، از جمله شناسه پیام و شناسه پیگیری، رشته
    هستند. آن‌ها را به عدد تبدیل نکنید. مبلغ‌ها در نسخه ۴ به ریال هستند.

    ## قالب‌ها و رمز یک‌بارمصرف

    متد `GetToken` فهرست قالب‌های حساب و وضعیت تأییدشان را برمی‌گرداند.
    درخواست آن فقط فیلد `apiKey` دارد و هر قالب شامل `key`، `textTemplate` و
    `status` است. این متد توکن ورود تولید نمی‌کند.

    برای ارسال با قالب، از `SendTokenSingle`، `SendTokenSingleConcatParam` یا
    `SendTokenMulti` استفاده می‌شود. پارامترهای query در ارسال تکی `P1` تا
    `P10` و در روش رشته‌ای `P` هستند؛ نام همین ورودی‌ها در بدنه JSON،
    `p1` تا `p10` و `p` است.

    متدهای `SendOtp` و `SendVoiceOtp` کد ۴ تا ۸ رقمی را بدون قالب اختصاصی
    می‌فرستند. فقط قالب با وضعیت `2` قابل ارسال است؛ وضعیت‌های در انتظار،
    ردشده و رد قطعی قابل ارسال نیستند. جزئیات در
    `codes/template-status.yaml` تعریف شده‌اند.

    سهمیه ارسال OTP برای هر کاربر جداگانه در پنل کاربری مشخص می‌شود و به
    سهمیه ارسال روزانه و شبانه تقسیم شده است. کد خطای API برابر `20`
    (`OtpApiLimitReached`) مربوط به این سهمیه است و با محدودیت نرخ درخواست
    و پاسخ HTTP `429` تفاوت دارد.

    ## کمپین

    متد `campaign/draft` پیش‌نویس و برآورد هزینه را می‌سازد و چیزی نمی‌فرستد.
    برای نهایی‌سازی آن، `campaign/draft/finalize` و برای ساخت و نهایی‌سازی
    در یک درخواست، `campaign/submit` به کار می‌رود.
    خطای نهایی‌سازی پیش‌نویس را نگه می‌دارد؛ خطای `submit` آن را حذف می‌کند.

    فهرست گیرندگان پس از `recipientsSeeded: true` آماده دریافت است.
    صفحه‌بندی از `page: 1` تا `totalPages` انجام می‌شود.
    مقدار `reducedCredit` هزینه خالص، یعنی مبلغ کسرشده منهای مبلغ برگشتی، است.

    کدهای پیشرفت، فیلتر و گیرندگان کمپین در جدول‌های جداگانه قرار دارند.
    وضعیت گیرنده کمپین با کدهای تحویل `StatusById` یکسان نیست.
    زمان‌های نسخه ۴ بدون پسوند منطقه زمانی و بر مبنای وقت محلی تهران،
    `UTC+03:30`، ذخیره و پردازش می‌شوند. برای فیلدهای `date-time-local` از
    قالب `YYYY-MM-DDTHH:mm:ss` با بخش اعشاری اختیاری ثانیه استفاده کنید؛
    پسوند `Z` یا offset به مقدار اضافه نکنید. برای نمونه،
    `2026-01-01T10:00:00` ساعت ۱۰ صبح تهران است. فیلد `time` پیام ورودی
    قالب جداگانه `yyyy-MM-dd HH:mm:ss` دارد.
    مقدار `sendTime: null` یعنی ارسال فوری.

    ## تکرار درخواست و گزارش تحویل

    سیاست تکرار هر کد در `codes/error-codes.yaml` آمده است:
    `never` یعنی درخواست بدون اصلاح علت خطا تکرار نشود؛ `backoff` یعنی
    تلاش با فاصله افزایشی؛ `limit-reset` یعنی انتظار تا آزاد شدن سهمیه.
    در متدهایی که ورودی `userTraceId` دارند، پس از timeout یا خطای داخلی،
    پیش از ارسال مجدد با همان شناسه و متد `StatusByUserTraceId` ثبت شدن پیام
    را بررسی کنید. متدهای `SendTokenSingle` و `SendTokenSingleConcatParam`
    ورودی شناسه پیگیری ندارند؛ در صورت نیاز به این نوع پیگیری، از
    `SendTokenMulti` با شناسه پیگیری هر گیرنده استفاده کنید. درخواست تغییر
    داده را بدون احراز نتیجه درخواست قبلی، خودکار تکرار نکنید.

    برای `StatusById` و `StatusByUserTraceId` استعلام را دسته‌ای و با فاصله
    چند دقیقه انجام دهید. روی مقدار عددی `statusCode` تصمیم بگیرید؛
    فیلد `status` برای نمایش است.

    | دسته | کدها | کار بعدی |
    | --- | --- | --- |
    | وضعیت در انتظار | `0`، `1`، `2`، `3`، `10` | دوباره استعلام کنید؛ دوباره ارسال نکنید. |
    | وضعیت نهایی | `4` تا `7`، `9`، `11` تا `16` | استعلام را متوقف کنید. |
    | وضعیت ارسال‌نشده | `17` تا `21` | مانع ارسال را مطابق جدول وضعیت برطرف کنید. |
    | وضعیت پیدا‌نشده | `8` | شناسه و تعلق آن به حساب را بررسی کنید. |

    این دسته‌بندی برای `ApiMessageStatus` است؛ برای وضعیت گیرندگان کمپین
    از جدول مستقل `codes/campaign-recipient-status.yaml` استفاده می‌شود.

    ## سرور آزمایشی

    پایه محیط آزمایشی نسخه ۴:

    ```
    https://www.payam-resan.com/uapi/v4SandBox
    ```

    محیط آزمایشی برای آزمودن درخواست بدون ارسال پیامک و مصرف اعتبار است.
    متد `SendMultiple` در این محیط ارائه نمی‌شود.
