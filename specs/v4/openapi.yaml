paths:
  /Send:
    post:
      tags:
        - ارسال
      summary: ارسال یک متن به گیرندگان.
      description: |-
        برای ارسال یک متن از یک خط به گیرندگان درخواست. متن و خط در سطح درخواست قرار دارند و هر گیرنده شماره و شناسه پیگیری خودش را دارد.

        مجوز لازم برای کلید: `Send`.
      operationId: V4_SendSingle
      parameters:
        - name: source-app
          in: header
          description: نام اختیاری برنامهٔ شما برای ثبت در گزارش درخواست‌ها؛ حداکثر ۱۰۰ نویسه.
            این مقدار کلید دسترسی نیست.
          schema:
            type: string
            maxLength: 100
      requestBody:
        x-name: req
        description: ورودی این متد را با نام و نوع فیلدهای اسکیمای درخواست، در بدنه JSON بفرستید.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBulkRequest'
            examples:
              request:
                summary: نمونهٔ درخواست
                value:
                  apiKey: YOUR_API_KEY
                  sender: 3000123456
                  text: پیام نمونه
                  recipients:
                    - destination: 989120000001
                      userTraceId: '10001'
        required: true
        x-position: 1
      responses:
        '200':
          description: 'ابتدا success را بررسی کنید: نتیجه در result و خطا در errorCode و error
            است.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfListOfSendResponseItem'
              examples:
                success:
                  summary: پاسخ موفق
                  value:
                    success: true
                    errorCode: null
                    error: null
                    result:
                      - id: '516000000000000001'
                        userTraceId: '10001'
                        parts: 1
                        credit: 1000
                    moreInfo: null
                invalid-key:
                  summary: کلید نامعتبر
                  value:
                    success: false
                    errorCode: 1
                    error: ApiKey نادرست است
                    result: null
                    moreInfo: null
                invalid-input:
                  summary: ورودی نامعتبر
                  value:
                    success: false
                    errorCode: 9
                    error: مقادیر ورودی نادرست است
                    result: null
                    moreInfo: null
                insufficient-credit:
                  summary: اعتبار ناکافی
                  value:
                    success: false
                    errorCode: 19
                    error: اعتبار حساب کافی نیست
                    result: null
                    moreInfo: null
        '429':
          description: تعداد درخواست بیش از حد مجاز است؛ زمان تلاش بعدی را از هدر پاسخ بخوانید.
        default:
          description: خطای ارتباط یا سرور؛ قالب پاسخ ممکن است با پاسخ معمول وب‌سرویس تفاوت
            داشته باشد.
