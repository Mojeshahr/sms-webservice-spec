info:
  title: راهنمای وب‌سرویس پیامک V4
  description: |-
    کلید `ApiKey` در POST داخل JSON و در GET داخل نشانی است. HTTP 200 همیشه به معنی موفقیت نیست؛ `success` را بررسی کنید و خطا را از `errorCode` و `error` بخوانید.

    برای تست بدون ارسال و هزینه، پایهٔ `/uapi/v4` را با `/uapi/v4SandBox` جایگزین کنید. اگر کلید تست تنظیم شده است، همان را بفرستید. `SendMultiple` در محیط تست وجود ندارد.

    <details><summary><strong>نکات اتصال</strong></summary>

    از HTTPS و ترجیحاً POST استفاده کنید. شماره‌های فرستنده و الگوها را از متدهای اطلاعات حساب و فهرست الگوها بگیرید.

    مجوز لازم کنار هر متد آمده است. کلید باید فعال و IP شما مجاز باشد. سقف ارسال و هزینه به تنظیمات حساب بستگی دارد.

    پذیرش درخواست به معنی تحویل نیست. پس از قطع ارتباط، پیش از ارسال دوباره وضعیت را با شناسهٔ پیگیری بررسی کنید.

    مبلغ‌ها ریال و زمان‌ها به وقت ایران هستند. شناسه‌های string را رشته نگه دارید. `sendTime: null` یعنی ارسال فوری.

    خطاهای HTTP مثل 429 یا 5xx ممکن است قالب پاسخ دیگری داشته باشند.

    </details>

    <details><summary><strong>کدهای خطا</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 1 | `InvalidApiKey` | 1 — ApiKey نادرست است |
    | 2 | `ApiIsNotActive` | 2 — ارسال از وبسرویس برای این کاربر فعال نشده است |
    | 3 | `UserIsNotActive` | 3 — کاربر فعال نیست |
    | 4 | `ApiTemproryDeactive` | 4 — ارسال از طریق Api موقتا غیر فعال است |
    | 5 | `MethodIsDeactive` | 5 — ارسال از طریق این متد موقتا غیر فعال است |
    | 6 | `NoAuthntication` | 6 — احراز هویت حساب انجام نشده است |
    | 8 | `AccountInfoIsIncomplete` | 8 — اطلاعات هویتی کاربر به صورت کامل درج نشده است |
    | 9 | `InvalidParameters` | 9 — مقادیر ورودی نادرست است |
    | 10 | `IpIsNotValid` | 10 — آی پی درخواست دهنده در لیست آی پی های معتبر نیست |
    | 11 | `MalformattedApiKey` | 11 — فرمت ورودی ApiKey نادرست است |
    | 12 | `InvalidSender` | 12 — شماره ارسال کننده نادرست است |
    | 13 | `InvalidDestination` | 13 — شماره دریافت کننده باید با 9 یا 989 شروع شود |
    | 14 | `UnauthorizedMethod` | 14 — شما به این متد دسترسی ندارید |
    | 15 | `DailyLimitReached` | 15 — سقف ارسال روزانه به پایان رسید |
    | 16 | `ApiLimitReached` | 16 — سقف ارسال Api به پایان رسید |
    | 17 | `NightlyLimitReached` | 17 — سقف ارسال شبانه به پایان رسید |
    | 18 | `ShareLineLimitReached` | 18 — سقف ارسال خط اشتراکی به پایان رسید |
    | 19 | `CreditIsLow` | 19 — اعتبار حساب کافی نیست |
    | 20 | `OtpApiLimitReached` | 20 — سقف ارسال OTP وب‌سرویس به پایان رسید |
    | 21 | `DailyPartLimitReached` | 21 — سقف تعداد پارت ارسالی روزانه به پایان رسید |
    | 22 | `DailyCreditLimitReached` | 22 — سقف اعتبار مصرفی روزانه به پایان رسید |
    | 23 | `InvalidSendTime` | 23 — زمان ارسال زمان‌بندی‌شده نامعتبر است (خارج از بازه مجاز) |
    | 24 | `RecipientVoiceLimitReached` | 24 — سقف تماس صوتی کد یکبارمصرف برای این شماره پر شده است (فاصله‌ی دو تماس یا سقف روزانه) |
    | 100 | `InternalError` | 100 — خطا داخلی سیستم |

    </details>


    <details><summary><strong>وضعیت تحویل پیامک</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 0 | `InQueue` | در صف سامانه |
    | 1 | `SentNoStatus` | ارسال شده، بدون وضعیت |
    | 2 | `SentInQueue` | ارسال شده، در صف |
    | 3 | `SentPendingToDeliver` | در انتظار تحویل گوشی |
    | 4 | `Delivered` | تحویل به گوشی |
    | 5 | `SentFailed` | نرسیده به گوشی |
    | 6 | `Failed` | خطا در ارسال |
    | 7 | `BlackList` | گیرنده مسدود |
    | 8 | `NotFound` | شناسه پیدا نشد |
    | 9 | `Expired` | منقضی |
    | 10 | `Unknown` | نامشخص |
    | 11 | `DeactiveDestination` | دریافت کننده نامعتبر |
    | 12 | `UserBlackList` | گیرنده در شماره‌های مسدود اکانت شماست |
    | 13 | `InvalidDestinationForOperator` | گیرنده نامعتبر |
    | 14 | `HasBlockWord` | متن بلاک |
    | 15 | `UnsubscribedByRecepient` | لغو دریافت توسط گیرنده |
    | 16 | `BlockedByRequester` | بلاک شده |
    | 17 | `DailyLimitReached` | اتمام سقف ارسال روزانه |
    | 18 | `ApiLimitReached` | اتمام سقف ارسال Api |
    | 19 | `NightlyLimitReached` | اتمام سقف ارسال شبانه |
    | 20 | `ShareLineLimitReached` | اتمام سقف خط اشتراکی |
    | 21 | `AccountNotAuthenticated` | حساب احراز نشده |

    </details>


    <details><summary><strong>وضعیت تأیید الگو</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 1 | `Pending` | در انتظار تأیید |
    | 2 | `Approved` | تأییدشده |
    | 3 | `Rejected` | ردشده |
    | 4 | `RejectedPermanently` | رد قطعی |

    </details>

    <details><summary><strong>راهنمای کمپین و وضعیت‌ها</strong></summary>

    با `draft` هزینه را ببینید و با `draft/finalize` تأیید کنید؛ `submit` هر دو را انجام می‌دهد. خطای نهایی‌سازی، پیش‌نویس را نگه می‌دارد؛ خطای submit آن را حذف می‌کند.

    صفحات از 1 تا `totalPages` هستند. گیرندگان پس از `recipientsSeeded: true` آماده‌اند؛ وضعیت null یعنی هنوز ارسال نشده است. `reducedCredit` هزینهٔ خالص است.

    <details><summary><strong>وضعیت پیشرفت کمپین</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 0 | `Draft` | پیش‌نویس |
    | 1 | `Scheduled` | زمان‌بندی شده |
    | 2 | `Sending` | در حال ارسال |
    | 3 | `Paused` | متوقف‌شده |
    | 4 | `NeedsAttention` | نیازمند بررسی |
    | 5 | `Completed` | پایان‌یافته |

    </details>


    <details><summary><strong>فیلتر وضعیت کمپین</strong></summary>

    | کد | نام | توضیح |
    | --- | --- | --- |
    | 1 | `InProgress` | در جریان |
    | 2 | `NeedsAction` | نیازمند بررسی |
    | 3 | `Completed` | پایان‌یافته |

    </details>

    کدهای وضعیت گیرندگان کمپین با کدهای `StatusById` تفاوت دارند؛ عنوان وضعیت در `statusTitle` یا `title` برمی‌گردد.

    <details><summary><strong>وضعیت گیرندگان کمپین</strong></summary>

    | کد | توضیح |
    | --- | --- |
    | 1 | در صف ارسال |
    | 10 | منقضی شد |
    | 11 | لغو دریافت |
    | 12 | شماره مسدود |
    | 13 | رد شد |
    | 14 | سقف ارسال |
    | 15 | اعتبار ناکافی |
    | 16 | ارسال نشد — خطای قیمت‌گذاری |
    | 17 | اعتبار نماینده ناکافی |
    | 18 | در انتظار بررسی |
    | 19 | در انتظار بررسی |
    | 20 | احراز هویت نشده |
    | 21 | ارسال نشد |
    | 22 | حساب مسدود |
    | 23 | خط غیرمجاز |
    | 24 | کاربر مسدود |
    | 25 | خارج از ساعت ارسال |
    | 26 | حساب نمایشی |
    | 27 | شماره نامعتبر |
    | 28 | حساب فعال نشده |
    | 29 | ارسال تکراری |
    | 30 | طول متن بیش از حد مجاز |
    | 100 | گیرنده مسدود |
    | 101 | متن رد شد |
    | 102 | لغو دریافت نزد اپراتور |
    | 103 | خط غیرفعال نزد اپراتور |
    | 104 | لینک برای این خط مجاز نیست |
    | 150 | رسیده به مخابرات |
    | 152 | تحویل شد |
    | 154 | تحویل نشد |
    | 155 | خطای اپراتور |
    | 156 | نامشخص |

    </details>

    </details>


    این توصیف فقط عملیات منتشرشده در Swagger رسمی را پوشش می‌دهد. درخواست‌ها و پاسخ‌های نمونه از همان سند هستند و با سرویس زنده آزموده نشده‌اند. نام فیلدها و حروف بزرگ و کوچک آن‌ها مطابق اسکیما و پارامترهای منتشرشده است. تعریف‌های پیشین sandbox که در Swagger عمومی نیستند، به‌عنوان شاهد تاریخی در sources/v4/previous-sandbox.json نگه داشته شده‌اند؛ وضعیت فعلی آن‌ها تأیید نشده است.
