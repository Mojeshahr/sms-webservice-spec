      description: پیش‌نمایش هزینه کمپین پیش از نهایی‌سازی؛ مبالغ به ریال است.
      additionalProperties: false
      properties:
        campaignId:
          type: string
          description: شناسه دریافتی از ایجاد پیش‌نویس یا ثبت کمپین.
        totalRecipients:
          type: integer
          description: تعداد گیرندگان کمپین در پیش‌نمایش.
          format: int32
        excludedCount:
          type: integer
          description: تعداد شماره‌های حذف‌شده، مانند شماره تکراری، مسدود یا لغو دریافت.
          format: int32
        requiredCredit:
          type: integer
          description: اعتبار لازم برای نهایی‌سازی کمپین، به ریال.
          format: int64
        currentCredit:
          type: integer
          description: اعتبار فعلی حساب، به ریال.
          format: int64
        canAfford:
          type: boolean
          description: کافی بودن اعتبار برای هزینه برآوردشده کمپین.
