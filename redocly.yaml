# پیکربندی linter برای spec.
#
#   docker run --rm -v "$PWD":/spec redocly/cli lint /spec/specs/v3/openapi.yaml /spec/specs/v4/openapi.yaml
#
# دو قاعده از مجموعه پیشنهادی خاموش شده‌اند. هر دو به‌خاطر ویژگی واقعی این
# سرویس، نه برای ساکت کردن linter.

extends:
  - recommended

rules:
  # احراز هویت این سرویس با یک securityScheme قابل بیان نیست: کلید در
  # متدهای GET پارامتر query است و در متدهای POST یک فیلد در بدنه JSON.
  # OpenAPI برای حالت دوم چیزی ندارد. اگر فقط متدهای GET را securityScheme
  # بدهیم، همین قاعده روی متدهای POST شکست می‌خورد و تصویر گمراه‌کننده‌ای
  # هم می‌سازد که انگار POSTها احراز هویت ندارند.
  #
  # به‌جایش ApiKey در هر متد یک پارامتر required صریح است، و توضیحش در
  # بخش «احراز هویت» توصیف info آمده.
  security-defined: off

  # V3 حتی برای خطا پاسخ 200 می‌دهد و Success: false و ErrorCode را برمی‌گرداند.
  # Swagger عمومی V4 پاسخ 429 هم ثبت کرده است؛ چون هر دو نسخه در این مخزن‌اند،
  # الزام یکسان برای پاسخ 4xx مناسب نیست. رفتار اجرایی V4 هنوز مستقلاً تأیید نشده.
  operation-4xx-response: off
